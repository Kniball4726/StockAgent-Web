services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockagent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockagent_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockagent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-stockagent_dev_password}@postgres:5432/stockagent
      STOCKAGENT_ENCRYPTION_KEY: ${STOCKAGENT_ENCRYPTION_KEY:?Definir clave >= 32 chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: /app/storage
      QUEUE_DRIVER: bullmq
      EVENT_BUS_DRIVER: redis
      REDIS_URL: redis://redis:6379
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      STOCKAGENT_SAAS_ADMIN_KEY: ${STOCKAGENT_SAAS_ADMIN_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - storage_data:/app/storage
      - backup_data:/app/backups

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
  storage_data:
  backup_data:
